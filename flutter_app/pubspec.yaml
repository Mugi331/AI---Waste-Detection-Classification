name: flutter_app

description: "WE Snap - Waste Detection & Classification for Recycling Assistance"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera capture + gallery picking.
  image_picker: ^1.1.2

  # HTTP backend communication.
  http: ^1.2.2

  # Opening-page video animation.
  video_player: ^2.9.2
  
  google_fonts: ^6.3.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/branding/
    - assets/bins/
    - assets/audio/
    # Do NOT add assets/audio/, assets/animations/, or
    # assets/illustrations/ here until those folders and their files
    # actually exist -- an entry pointing at a missing directory breaks
    # the build. See lib/services/audio_service.dart for the
    # audio placeholder pattern used in the meantime.
