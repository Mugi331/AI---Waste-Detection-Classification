name: flutter_app
description: "EcoSort AI - Waste Detection & Classification for Recycling Assistance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera capture + gallery picking. Works on Flutter Web via the
  # endorsed image_picker_for_web implementation (pulled in
  # automatically - no separate entry needed).
  image_picker: ^1.1.2

  # Not called yet (the app currently uses MockDetectionService), but
  # included ready for when ApiDetectionService is uncommented in
  # lib/services/detection_service.dart to call the real backend.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
